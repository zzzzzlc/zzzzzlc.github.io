name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install

      # ─────────────────────────────────────────────────────────────
      # 质量门禁（当前已关闭，保留备用）
      # 启用方法：去掉下面两段前面的「#」，并确认 package.json 里有对应脚本
      # ─────────────────────────────────────────────────────────────
      # - name: Lint
      #   run: pnpm run lint
      #
      # - name: Type check（tsc --noEmit，只做类型检查不产出）
      #   run: pnpm exec tsc --noEmit
      # ─────────────────────────────────────────────────────────────

      - run: pnpm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
